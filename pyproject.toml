[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authorization-contract-runtime"
version = "0.1.2"
description = "Synthetic signed-capability evaluation with an optional Dioptra adapter"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Yanzhi Xin"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
authorization_contract_runtime = ["assets/*"]
